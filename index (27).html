<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cf: 0, cfManual: false, tab: 0, faq: -1, pago: 'ars', now: Date.now(), k: 0, rVentas: 120, rMargen: 100, rDias: 3, rPauta: 1000 };
  }
  lockCfHeight() {
    // Fija la altura del bloque "Cómo funciona" a la del paso más alto, para que la página no salte cuando rotan los pasos.
    const el = document.querySelector('.mx-cf');
    if (!el) return;
    let tag = document.getElementById('mx-cf-lock');
    if (!tag) { tag = document.createElement('style'); tag.id = 'mx-cf-lock'; document.head.appendChild(tag); }
    tag.textContent = '';
    const keep = this.state.cf || 0;
    const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    let max = 0;
    const medir = async () => {
      for (const i of [0, 1, 2]) { this.setState({ cf: i }); await frame(); max = Math.max(max, el.getBoundingClientRect().height); }
      this.setState({ cf: keep });
      tag.textContent = '.mx-cf{min-height:' + Math.ceil(max) + 'px}';
    };
    return medir();
  }
  componentDidMount() {
    this.lockCfHeight();
    let w = window.innerWidth, t = null;
    window.addEventListener('resize', () => { if (window.innerWidth === w) return; w = window.innerWidth; clearTimeout(t); t = setTimeout(() => this.lockCfHeight(), 200); });
    this._tick = setInterval(() => this.setState({ now: Date.now() }), 1000);
    this._cf = setInterval(() => { if (!this.state.cfManual) this.setState({ cf: ((this.state.cf || 0) + 1) % 3 }); }, 6000);
    const start = Date.now();
    this._count = setInterval(() => {
      const k = Math.min(1, (Date.now() - start) / 1600);
      this.setState({ k: k });
      if (k >= 1) clearInterval(this._count);
    }, 40);
  }
  renderVals() {
    const accent = this.props.accent ?? '#b5ff00';
    const total = this.props.cuposTotales ?? 5;
    const restantes = Math.max(0, Math.min(total, this.props.cuposRestantes ?? 3));
    const now = new Date(this.state.now);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 1, 0, 0, 0);
    const diff = Math.max(0, Math.floor((end - now) / 1000));
    const pad = (x) => String(x).padStart(2, '0');
    const cd = { d: pad(Math.floor(diff / 86400)), h: pad(Math.floor(diff % 86400 / 3600)), m: pad(Math.floor(diff % 3600 / 60)), s: pad(diff % 60) };
    const ease = 1 - Math.pow(1 - this.state.k, 3);
    const n = {
      conv: Math.round(215000 * ease).toLocaleString('es-AR'),
      ars: Math.round(150 * ease),
      anios: Math.round(2 * ease),
      exp: Math.round(7 * ease)
    };
    const tabData = [
      { num: '01', title: 'Pauta que no se apaga', line: 'Campañas gestionadas por expertos. Cargás tu saldo por nosotros, sin tarjeta.' },
      { num: '02', title: 'Chats ordenados', line: 'WhatsApp e Instagram en un CRM con app: ves cada conversación desde tu celular.' },
      { num: '03', title: 'Analítica de adquisición con IA', line: 'Cada mes, la IA te dice qué vendió y qué hacer.' }
    ];
    const tabs = tabData.map((t, i) => {
      const on = this.state.tab === i;
      return Object.assign({}, t, {
        pick: () => this.setState({ tab: i }),
        style: 'width: 100%; display: flex; gap: 16px; align-items: flex-start; text-align: left; cursor: pointer; font-family: inherit; padding: 18px 20px; border-radius: 14px; background: ' + (on ? 'rgba(181,255,0,0.07)' : '#0b0b0b') + '; border: 1px solid ' + (on ? 'rgba(181,255,0,0.6)' : '#222') + '; transition: all .2s'
      });
    });
    const faqData = [
      { q: '¿Mi equipo tiene que aprender algo nuevo?', a: 'No. Siguen atendiendo desde el celular, como hoy. En el arranque los capacitamos en el CRM.' },
      { q: '¿Tengo que tener pauta activa hoy?', a: 'No. Si ya invertís, tomamos tus campañas. Si no, armamos la estrategia y la encendemos en 7 días.' },
      { q: '¿Cómo cargo la plata de la pauta?', a: 'Por nuestra cuenta publicitaria, así la campaña no depende de tu tarjeta. En USDT pagás la inversión más el 17% de comisión. En pesos se suma el IVA del 21% sobre inversión y comisión, con factura para que lo desgraves.' },
      { q: '¿Incluye un agente de IA que responda solo?', a: 'No. Este sistema trae clientes, ordena y mide. Si además querés que responda 24/7, lo sumás con nuestro agente cuando quieras.' },
      { q: '¿Y si no cumplen?', a: 'Si en 7 días no tenés las campañas encendidas y el CRM andando, no pagás el primer mes. Así de simple.' }
    ];
    const faqs = faqData.map((f, i) => {
      const open = this.state.faq === i;
      return Object.assign({}, f, {
        open: open,
        toggle: () => this.setState({ faq: open ? -1 : i }),
        iconStyle: 'flex: none; font-size: 24px; font-weight: 400; color: ' + accent + '; transition: transform .2s; transform: rotate(' + (open ? '45deg' : '0deg') + ')'
      });
    });
    const cupos = [];
    for (let i = 0; i < total; i++) {
      const taken = i < total - restantes;
      cupos.push({
        label: taken ? 'Tomado' : 'Libre',
        style: 'width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-family: Space Mono, monospace; font-size: 11px; ' + (taken ? 'background: #1a1a1a; color: #6b6b6b; border: 1px solid #262626; text-decoration: line-through' : 'background: rgba(181,255,0,0.1); color: ' + accent + '; border: 1px solid ' + accent)
      });
    }
    const pill = (on) => 'flex: 1; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; padding: 10px; border-radius: 6px; border: 0; min-height: 40px; ' + (on ? 'background: ' + accent + '; color: #000' : 'background: transparent; color: #cccccc');
    const ars = this.state.pago === 'ars';
    // Calculadora: costo de no tenerlo + recupero
    const usd = (x) => 'USD ' + Math.round(x).toLocaleString('es-AR');
    const rv = this.state.rVentas, rm = this.state.rMargen, rd = this.state.rDias, rp = this.state.rPauta;
    const porDia = rv / 30;
    const perdidos = porDia * rd;
    const perdida = perdidos * rm;
    const costo = 400 + rp * 0.17;
    const equilibrio = Math.ceil(costo / rm);
    const meses = perdida / costo;
    const fmt1 = (x) => (Math.round(x * 10) / 10).toLocaleString('es-AR');
    const dTxt = rd + (rd === 1 ? ' día' : ' días');
    const roi = {
      porDia: fmt1(porDia),
      perdidos: rd === 0 ? '0' : '~' + Math.round(perdidos),
      perdidaTxt: usd(perdida),
      comisionTxt: usd(rp * 0.17),
      costoTxt: usd(costo),
      equilibrio: equilibrio,
      pctVentas: Math.max(1, Math.round(equilibrio / rv * 100)) + '%',
      veredicto: rd === 0
        ? 'Aunque nunca se te corte la pauta, el motor se paga con ' + equilibrio + ' equipos: menos de lo que vendés en ' + Math.max(1, Math.ceil(equilibrio / porDia)) + ' días.'
        : (meses >= 1
          ? 'Lo que perdés en ' + dTxt + ' sin pauta paga ' + fmt1(meses) + (fmt1(meses) === '1' ? ' mes' : ' meses') + ' del motor.'
          : 'Lo que perdés en ' + dTxt + ' sin pauta ya cubre el ' + Math.round(meses * 100) + '% del motor. El resto lo recuperás con ' + Math.max(1, Math.ceil((costo - perdida) / rm)) + ' equipos.')
    };
    const campo = (key, label, min, max, step, txt, hint) => ({ label: label, min: min, max: max, step: step, val: this.state[key], txt: txt, hint: hint, set: (e) => this.setState({ [key]: Number(e.target.value) }) });
    const roiCampos = [
      campo('rVentas', 'Equipos que vendés por mes', 30, 300, 10, String(rv), 'La tienda de referencia vende 120.'),
      campo('rMargen', 'Ganancia por equipo', 50, 200, 10, usd(rm), 'Lo que te queda limpio por cada equipo vendido.'),
      campo('rDias', 'Días al mes con la pauta cortada', 0, 10, 1, dTxt, 'Una tarjeta rechazada un viernes son 3 días sin campañas hasta el lunes.'),
      campo('rPauta', 'Inversión en anuncios por mes', 300, 5000, 100, usd(rp), 'Sobre esto se calcula la comisión del 17%.')
    ];
    return {
      roi: roi, roiCampos: roiCampos,
      accent: accent,
      agenda: 'https://wa.me/595987599720?text=Hola%2C%20vi%20el%20sitio%20de%20METEX%20360%20y%20me%20interesa%20el%20Motor%20de%20Adquisici%C3%B3n%20para%20mi%20tienda%20iPhone',
      wa: 'https://wa.me/595987599720?text=Hola%2C%20vi%20el%20sitio%20de%20METEX%20360%20y%20me%20interesa%20el%20Motor%20de%20Adquisici%C3%B3n%20para%20mi%20tienda%20iPhone',
      cuposRestantes: restantes,
      cuposTotales: total,
      cd: cd,
      n: n,
      tabs: tabs,
      tab0: this.state.tab === 0,
      tab1: this.state.tab === 1,
      tab2: this.state.tab === 2,
      faqs: faqs,
      cupos: cupos,
      pickArs: () => this.setState({ pago: 'ars' }),
      pickUsdt: () => this.setState({ pago: 'usdt' }),
      arsStyle: pill(ars),
      usdtStyle: pill(!ars),
      pagoTexto: ars ? 'Transferencia en pesos, con factura. Se suma el IVA, que después desgravás.' : 'Solo la comisión, sin IVA. Desde tu billetera, sin convertir, sin tope de carga y se activa en el momento.',
      ej: ars ? { base: 'ARS 1.000.000', com: 'ARS 170.000', conIva: true, iva: 'ARS 245.700', total: 'ARS 1.415.700', nota: 'Con factura: el IVA lo recuperás como crédito fiscal.' } : { base: 'USDT 1.000', com: 'USDT 170', conIva: false, iva: '', total: 'USDT 1.170', nota: 'Sin IVA: pagás solo la comisión.' },
      showCd: true,
      cfSteps: [
        { label: 'PAUTA', short: 'Pauta', title: 'Campañas que no se cortan', desc: 'Cargás saldo en pesos o USDT por nuestra cuenta publicitaria. Sin tarjeta, sin bloqueos. En 7 días están encendidas.' },
        { label: 'CONVERSACIONES', short: 'CRM con app', title: 'Te instalamos un CRM con app', desc: 'Todos tus chats de WhatsApp e Instagram en un solo lugar, cada uno con su estado. Lo usás desde la app del celular, en todo momento.' },
        { label: 'NUESTRA ESTRATEGIA', short: 'Ventas a Meta', title: 'Le enseñamos a Meta quién te compra', desc: 'Cada venta que marcás en el CRM se la enviamos a Meta por la API de Conversiones. Sin esto, Meta solo busca gente que escribe. Con esto, tu pauta apunta a gente que compra.' }
      ].map((s, i) => {
        const on = (this.state.cf || 0) === i;
        return Object.assign({}, s, {
          on: on, i0: i === 0, i1: i === 1, i2: false, i3: i === 2,
          icColor: on ? '#000' : '#b5ff00',
          mColor: on ? '#fefffc' : '#8a8a8a',
          anim: this.state.cfManual ? 'none' : 'mx-fill 6s linear both',
          pick: () => this.setState({ cf: i, cfManual: true }),
          style: 'width: 100%; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 14px; text-align: left; transition: all .2s; background: ' + (on ? 'rgba(181,255,0,0.07)' : '#0b0b0b') + '; border: 1px solid ' + (on ? 'rgba(181,255,0,0.6)' : '#222'),
          numStyle: 'flex: none; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: ' + accent : 'background: #161616; border: 1px solid #2a2a2a'),
          mStyle: 'flex: 1; min-width: 0; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px 4px; border-radius: 10px; background: ' + (on ? 'rgba(181,255,0,0.08)' : 'transparent') + '; border: 1px solid ' + (on ? 'rgba(181,255,0,0.5)' : '#222')
        });
      }),
      cfTitle: ['Campañas que no se cortan', 'Te instalamos un CRM con app', 'Le enseñamos a Meta quién te compra'][this.state.cf || 0],
      cfDesc: ['Cargás saldo en pesos o USDT por nuestra cuenta publicitaria. Sin tarjeta, sin bloqueos. En 7 días están encendidas.', 'Todos tus chats de WhatsApp e Instagram en un solo lugar, cada uno con su estado. Lo usás desde la app del celular, en todo momento.', 'Cada venta que marcás en el CRM se la enviamos a Meta por la API de Conversiones. Sin esto, Meta solo busca gente que escribe. Con esto, tu pauta apunta a gente que compra.'][this.state.cf || 0],
      cf0: (this.state.cf || 0) === 0,
      cf1: this.state.cf === 1,
      cf2: this.state.cf === 2
    };
  }
}

MX.mount(Component, {"accent": "#b5ff00", "cuposRestantes": 3, "cuposTotales": 5});
</script>
